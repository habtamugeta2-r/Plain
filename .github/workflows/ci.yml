name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # One step runs every check so a single failure still produces all logs.
      - name: fmt + build + test + clippy
        shell: bash
        run: |
          set +e
          status=0
          echo "::group::cargo fmt"
          cargo fmt --all -- --check > fmt.log 2>&1 || status=1
          tail -n 60 fmt.log
          echo "::endgroup::"

          echo "::group::cargo build"
          cargo build --workspace --all-targets > build.log 2>&1 || status=1
          tail -n 80 build.log
          echo "::endgroup::"

          echo "::group::cargo test"
          cargo test --workspace > test.log 2>&1 || status=1
          tail -n 80 test.log
          echo "::endgroup::"

          echo "::group::cargo clippy"
          cargo clippy --workspace --all-targets -- -D warnings > clippy.log 2>&1 || status=1
          tail -n 80 clippy.log
          echo "::endgroup::"

          exit $status

      # Sandbox/agent environments cannot download Actions log archives, so the
      # tail of every log is also posted as a commit comment where the API can
      # reach it.
      - name: publish failure log
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### CI failure on ${{ matrix.os }}"
            echo
            echo "commit \`${{ github.sha }}\`, run ${{ github.run_id }}"
            echo
            for f in fmt.log build.log test.log clippy.log; do
              [ -s "$f" ] || continue
              # Every diagnostic header, its location and the offending source
              # line, deduplicated. A plain tail hides the first errors when
              # there are many, and the first error is usually the real one.
              {
                echo "<details><summary><code>$f</code></summary>"
                echo
                echo '```'
                sed 's/\x1b\[[0-9;]*m//g' "$f" |
                  grep -E '^(error|warning)(\[|:)|^[[:space:]]*--> |^[[:space:]]*= (note|help):|^[0-9]+[[:space:]]*\||^test .* FAILED|^failures:|^---- ' |
                  sed 's#^[[:space:]]*--> ##; s#/home/runner/work/Plain/Plain/##; s#/Users/runner/work/Plain/Plain/##; s#D:\\\\a\\\\Plain\\\\Plain\\\\##' |
                  awk '!seen[$0]++' |
                  head -n 500
                echo '```'
                echo
                echo "</details>"
                echo
              }
            done
          } > body.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@body.md

  runtime:
    name: runtime (jsdom)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: Install
        run: npm ci

      - name: Test the runtime against a real DOM
        run: npm test

  # rustfmt output is machine-generated; rather than fail on it, this job applies
  # it and pushes back so the branch is always canonically formatted.
  autofmt:
    name: auto-format
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt and push if needed
        shell: bash
        run: |
          cargo fmt --all
          if [ -z "$(git status --porcelain)" ]; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: cargo fmt (automated)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
